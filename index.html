      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap"

  <body class="bg-[#F3F5F1] text-[#16232F] antialiased selection:bg-[#0E2238] selection:text-[#F3F5F1]">
    <div id="root"></div>
    <script>
      (function() {
        function removeRemix() {
          const els = document.querySelectorAll('a, button, div, span');
          els.forEach(el => {
            if (el.textContent && el.textContent.trim().toLowerCase() === 'remix') {
              const target = el.closest('header, nav, div[class*="banner"], div[class*="header"]') || el;
              target.style.display = 'none';
            }
          });
        }
        window.addEventListener('DOMContentLoaded', removeRemix);
        setInterval(removeRemix, 1000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
